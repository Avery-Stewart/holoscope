<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D0E14">
<meta name="description" content="Scan your cards, see what they're worth, and keep track of your collection.">
<title>HoloScope</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0D0E14; --bg-2:#12131B; --surface:#181A25; --surface-2:#212435; --surface-3:#2A2E44;
  --line:rgba(255,255,255,.07); --text:#F5F6FA; --muted:#9298B3; --dim:#646A86;
  --red:#FF4757; --red-2:#E02B3C; --red-soft:rgba(255,71,87,.14);
  --gold:#FFC93C; --up:#2FD585; --down:#FF6B7A;
  --r-lg:24px; --r-md:18px; --r-sm:12px;
  --head:'Fredoka', ui-rounded, system-ui, sans-serif;
  --body:'Nunito', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  --top: env(safe-area-inset-top, 0px); --bot: env(safe-area-inset-bottom, 0px);
  --tabh: 76px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;overscroll-behavior:none}
body{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:inherit}
img{display:block;max-width:100%}
h1,h2,h3{font-family:var(--head);font-weight:600;margin:0;letter-spacing:.2px}

/* ---------- top bar ---------- */
.topbar{position:fixed;inset:0 0 auto 0;z-index:20;padding:calc(var(--top) + 10px) 18px 10px;display:flex;align-items:center;gap:10px;
  background:linear-gradient(var(--bg) 70%, rgba(13,14,20,0));}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--head);font-weight:700;font-size:23px}
.brand b{color:var(--red);font-weight:700}
.brand svg{width:30px;height:30px}
.topbar .spacer{flex:1}
.icon-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);position:relative}
.icon-btn svg{width:22px;height:22px}
.icon-btn:active{transform:scale(.94)}
.sync-dot{position:absolute;right:8px;top:8px;width:9px;height:9px;border-radius:50%;background:var(--dim);border:2px solid var(--surface)}
.sync-dot.ok{background:var(--up)} .sync-dot.syncing,.sync-dot.pending{background:var(--gold);animation:pulse 1s infinite}
.sync-dot.error{background:var(--down)} .sync-dot.offline{background:var(--dim)}
@keyframes pulse{50%{opacity:.35}}

/* ---------- views ---------- */
main{position:fixed;inset:0}
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(var(--top) + 74px) 16px calc(var(--tabh) + var(--bot) + 24px)}
.view:not(.active){display:none}

/* ---------- tab bar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--tabh) + var(--bot));padding-bottom:var(--bot);
  display:grid;grid-template-columns:1fr 110px 1fr;align-items:center;
  background:rgba(18,19,27,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--dim);font-weight:800;font-size:13px;height:100%;justify-content:center}
.tab svg{width:26px;height:26px}
.tab.active{color:var(--text)}
.tab.active svg{color:var(--red)}
.scan-tab{justify-self:center;align-self:start;width:78px;height:78px;margin-top:-30px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #ff6b78, var(--red) 45%, var(--red-2));
  border:5px solid var(--bg);box-shadow:0 0 0 2px rgba(255,255,255,.9) inset, 0 10px 28px rgba(255,71,87,.45);
  display:grid;place-items:center;color:#fff;transition:transform .15s}
.scan-tab svg{width:32px;height:32px}
.scan-tab:active{transform:scale(.92)}
.scan-tab.shutter{animation:ring 1.8s infinite}
@keyframes ring{0%{box-shadow:0 0 0 2px #fff inset,0 0 0 0 rgba(255,71,87,.6)}70%{box-shadow:0 0 0 2px #fff inset,0 0 0 16px rgba(255,71,87,0)}100%{box-shadow:0 0 0 2px #fff inset,0 0 0 0 rgba(255,71,87,0)}}
.scan-label{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--bot) + 6px);font-size:13px;font-weight:800;color:var(--dim)}
.scan-label.active{color:var(--text)}

/* ---------- buttons / chips ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 22px;border-radius:16px;font-weight:800;font-size:17px;background:var(--surface-2);border:1px solid var(--line);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn svg{width:20px;height:20px}
.btn.primary{background:linear-gradient(180deg,#ff5a68,var(--red-2));border:0;color:#fff;box-shadow:0 8px 22px rgba(255,71,87,.35)}
.btn.block{width:100%}
.btn.ghost{background:transparent}
.btn.sm{min-height:42px;padding:0 14px;font-size:15px;border-radius:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:44px;padding:0 16px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-weight:800;font-size:15px;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--red-soft);border-color:var(--red);color:#fff}

/* ---------- collection ---------- */
.worth{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:20px 20px 18px;margin-bottom:16px;
  background:radial-gradient(120% 140% at 100% 0%, rgba(255,71,87,.35), transparent 55%),
             radial-gradient(90% 120% at 0% 100%, rgba(120,90,255,.22), transparent 60%), var(--surface);
  border:1px solid var(--line)}
.worth .label{color:var(--muted);font-weight:800;font-size:14px;text-transform:uppercase;letter-spacing:1px}
.worth .big{font-family:var(--head);font-weight:700;font-size:44px;line-height:1.1;margin:4px 0 6px}
.worth .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700;color:var(--muted)}
.delta{display:inline-flex;align-items:center;gap:3px;font-weight:800;padding:3px 9px;border-radius:999px;font-size:14px}
.delta.up{color:var(--up);background:rgba(47,213,133,.12)} .delta.down{color:var(--down);background:rgba(255,107,122,.12)}
.delta.flat{color:var(--muted);background:rgba(255,255,255,.06)}
.worth .refresh{position:absolute;right:14px;top:14px}
.spin svg{animation:spin 1s linear infinite} @keyframes spin{to{transform:rotate(360deg)}}

.searchbox{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:0 14px;min-height:54px}
.searchbox:focus-within{border-color:var(--red)}
.searchbox svg{width:22px;height:22px;color:var(--muted);flex:0 0 auto}
.searchbox input{flex:1;background:none;border:0;outline:0;font-size:17px;font-weight:700;min-width:0}
.searchbox input::placeholder{color:var(--dim)}
.searchbox select{background:var(--surface-2);border:0;border-radius:10px;padding:8px 10px;font-weight:800;font-size:14px;color:var(--text);outline:0}
.controls{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-bottom:16px}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{position:relative;text-align:left;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);padding:9px 9px 12px;transition:transform .15s;animation:pop .3s both}
.tile:active{transform:scale(.97)}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.tile .art{position:relative;border-radius:11px;overflow:hidden;aspect-ratio:63/88;background:var(--surface-2)}
.tile .art img{width:100%;height:100%;object-fit:cover}
.tile .art::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.18) 45%,rgba(255,200,255,.10) 52%,transparent 66%);background-size:250% 100%;background-position:100% 0;transition:background-position .7s;pointer-events:none}
.tile:active .art::after,.tile:hover .art::after{background-position:0 0}
.tile .name{font-weight:800;font-size:15px;margin:9px 2px 1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .sub{font-size:12.5px;color:var(--muted);font-weight:700;margin:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .price{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:8px 2px 0}
.tile .price b{font-family:var(--head);font-size:19px;font-weight:600}
.tile .delta{font-size:12px;padding:2px 7px}
.qty{position:absolute;top:15px;right:15px;z-index:2;background:rgba(13,14,20,.85);backdrop-filter:blur(6px);border-radius:999px;padding:3px 9px;font-weight:800;font-size:13px;border:1px solid rgba(255,255,255,.15)}
.cond{position:absolute;top:15px;left:15px;z-index:2;background:rgba(13,14,20,.85);border-radius:999px;padding:3px 8px;font-weight:800;font-size:11.5px;border:1px solid rgba(255,255,255,.15)}
.cond.graded{color:var(--gold);border-color:rgba(255,201,60,.45)}
.best{position:absolute;top:15px;left:15px;z-index:2;background:var(--red);color:#fff;border-radius:999px;padding:4px 10px;font-weight:800;font-size:12px}

.empty{text-align:center;padding:30px 20px 10px;color:var(--muted)}
.empty > svg{width:150px;height:150px;margin:0 auto 10px;display:block}
.empty h2{color:var(--text);font-size:26px;margin-bottom:6px}
.empty p{margin:0 0 20px;font-weight:600;line-height:1.45}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 12px}
.section-title h3{font-size:20px}
.muted{color:var(--muted)} .small{font-size:13px}

/* ---------- scan ---------- */
#view-scan{padding:0;overflow:hidden;background:#000}
.cam-box{position:absolute;inset:0;overflow:hidden}
.cam-box video,.cam-box .still{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.frame{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);
  width:min(74vw, calc((100dvh - var(--tabh) - var(--bot) - var(--top) - 230px) * 63 / 88));aspect-ratio:63/88;border-radius:20px;
  box-shadow:0 0 0 200vmax rgba(5,6,10,.62);pointer-events:none}
.frame i{position:absolute;width:44px;height:44px;border:5px solid #fff;filter:drop-shadow(0 0 8px rgba(255,71,87,.6))}
.frame i:nth-child(1){left:-3px;top:-3px;border-right:0;border-bottom:0;border-radius:20px 0 0 0}
.frame i:nth-child(2){right:-3px;top:-3px;border-left:0;border-bottom:0;border-radius:0 20px 0 0}
.frame i:nth-child(3){left:-3px;bottom:-3px;border-right:0;border-top:0;border-radius:0 0 0 20px}
.frame i:nth-child(4){right:-3px;bottom:-3px;border-left:0;border-top:0;border-radius:0 0 20px 0}
.frame .beam{position:absolute;left:6%;right:6%;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,var(--red),#fff,var(--red),transparent);box-shadow:0 0 16px var(--red);animation:beam 1.4s ease-in-out infinite alternate}
@keyframes beam{from{top:6%}to{top:93%}}
.frame canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:18px}
.cam-hint{position:absolute;left:0;right:0;top:calc(var(--top) + 72px);text-align:center;z-index:3;padding:0 20px}
.cam-hint .pill{display:inline-block;background:rgba(13,14,20,.75);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:10px 18px;font-weight:800;font-size:16px}
.cam-actions{position:absolute;left:0;right:0;bottom:calc(var(--tabh) + var(--bot) + 18px);display:flex;justify-content:center;gap:14px;z-index:3}
.cam-actions .btn{background:rgba(13,14,20,.75);backdrop-filter:blur(10px);border-color:rgba(255,255,255,.14)}
.cam-actions .btn.on{background:var(--gold);color:#111}
.cam-msg{position:absolute;inset:0;display:grid;place-items:center;padding:calc(var(--top) + 80px) 26px calc(var(--tabh) + 40px);text-align:center;background:var(--bg);z-index:4}
.cam-msg h2{font-size:26px;margin:10px 0 8px}
.cam-msg p{color:var(--muted);font-weight:600;line-height:1.45;margin:0 0 20px}
.cam-msg .stack{display:grid;gap:12px;width:min(340px,100%);margin:0 auto}
.progress{height:8px;border-radius:8px;background:var(--surface-2);overflow:hidden;margin-top:12px}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--gold));transition:width .3s}

/* ---------- page (detail) ---------- */
.page{position:fixed;inset:0;z-index:40;background:var(--bg);transform:translateX(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.page.open{transform:none}
.page-head{display:flex;align-items:center;gap:12px;padding:calc(var(--top) + 10px) 14px 10px}
.page-head .title{font-family:var(--head);font-weight:600;font-size:19px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page-body{flex:1;overflow-y:auto;padding:4px 18px 30px}
.page-foot{padding:12px 18px calc(var(--bot) + 14px);border-top:1px solid var(--line);background:var(--bg-2)}
.hero{position:relative;width:min(68vw,300px);margin:6px auto 18px;aspect-ratio:63/88;border-radius:16px;overflow:hidden;
  box-shadow:0 24px 60px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08);background:var(--surface-2)}
.hero img{width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.28) 47%,rgba(255,180,255,.14) 53%,transparent 65%);background-size:300% 100%;animation:shine 3.2s ease-in-out 0.4s infinite;pointer-events:none}
@keyframes shine{0%{background-position:100% 0}45%,100%{background-position:0 0}}
.glow{position:absolute;left:50%;top:40px;width:80vw;height:300px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(255,71,87,.25),transparent);pointer-events:none;z-index:-1}
.d-name{font-size:32px;text-align:center;line-height:1.1}
.d-chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0 18px}
.tag{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:800;font-size:13.5px;color:var(--muted)}
.tag.red{color:#fff;background:var(--red-soft);border-color:rgba(255,71,87,.5)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;margin-bottom:14px}
.panel h3{font-size:19px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.worth-line{text-align:center;margin-bottom:16px}
.worth-line .k{color:var(--muted);font-weight:800;font-size:14px;text-transform:uppercase;letter-spacing:1px}
.worth-line .v{font-family:var(--head);font-weight:700;font-size:46px;line-height:1.1}
.worth-line .s{color:var(--dim);font-weight:700;font-size:13px}
table.pt{width:100%;border-collapse:collapse;font-weight:700}
table.pt th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;text-align:right;padding:0 0 10px 12px;font-weight:800;white-space:nowrap}
table.pt th:first-child{text-align:left}
table.pt td{padding:12px 0 12px 12px;border-top:1px solid var(--line);text-align:right;font-size:16px;vertical-align:middle}
table.pt td:first-child{text-align:left;padding-left:0}
table.pt th:first-child{padding-left:0}
table.pt td .lbl{display:block;font-weight:800}
table.pt td .sub{display:block;font-size:12px;color:var(--dim);font-weight:700}
table.pt td.na{color:var(--dim)}
table.pt tr.grade td:first-child .lbl{color:var(--gold)}
table.pt tr.group td{padding:14px 0 2px;border-top:0;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:800}
.mini-link{color:var(--red);font-weight:800;font-size:13px;text-decoration:none}
.note{font-size:13px;color:var(--muted);font-weight:600;line-height:1.45;margin:12px 0 0}
.skel{display:inline-block;width:56px;height:16px;border-radius:6px;background:linear-gradient(90deg,var(--surface-2),var(--surface-3),var(--surface-2));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.info{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;font-weight:700}
.info dt{color:var(--muted)} .info dd{margin:0;text-align:right}
.chart{width:100%;height:auto;display:block}
.chart-empty{padding:18px 6px;text-align:center;color:var(--muted);font-weight:700;line-height:1.45}
.own-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.own-row:first-of-type{border-top:0}
.own-row .what{flex:1;font-weight:800;line-height:1.25}
.own-row .what small{display:block;color:var(--muted);font-weight:700;font-size:13px}
.stepper{display:flex;align-items:center;background:var(--surface-2);border-radius:14px;border:1px solid var(--line)}
.stepper button{width:44px;height:44px;display:grid;place-items:center;font-size:22px;font-weight:800}
.stepper span{min-width:28px;text-align:center;font-weight:800;font-size:18px}
.del{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--down);background:rgba(255,107,122,.1)}
.del.confirm{width:auto;padding:0 12px;font-weight:800;font-size:14px;background:var(--down);color:#fff}
.del svg{width:20px;height:20px}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-height:88dvh;display:flex;flex-direction:column;background:var(--bg-2);
  border-radius:28px 28px 0 0;border-top:1px solid var(--line);transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:none}
.sheet .grab{width:44px;height:5px;border-radius:5px;background:var(--surface-3);margin:10px auto 4px}
.sheet .s-head{display:flex;align-items:center;gap:10px;padding:6px 18px 10px}
.sheet .s-head h2{flex:1;font-size:24px}
.sheet .s-body{overflow-y:auto;min-height:0;padding:4px 18px 18px}
.sheet .s-foot{padding:12px 18px calc(var(--bot) + 14px);border-top:1px solid var(--line);display:grid;gap:10px}
.q{font-weight:800;font-size:16px;margin:16px 2px 10px}
.q:first-child{margin-top:4px}
.field{display:grid;gap:7px;margin-bottom:14px}
.field label{font-weight:800;font-size:14px;color:var(--muted)}
.field input{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px;font-weight:700;font-size:16px;outline:0;width:100%}
.field input:focus{border-color:var(--red)}
.field .hint{font-size:12.5px;color:var(--dim);font-weight:600;line-height:1.4}
.field .hint a{color:var(--red)}
.status{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;padding:10px 12px;border-radius:12px;background:var(--surface)}
.status i{width:10px;height:10px;border-radius:50%;background:var(--dim);flex:0 0 auto}
.status.ok i{background:var(--up)} .status.error i{background:var(--down)} .status.syncing i,.status.pending i{background:var(--gold)}
hr.sep{border:0;border-top:1px solid var(--line);margin:18px 0}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + var(--bot) + 20px);z-index:90;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:#fff;color:#111;font-weight:800;padding:13px 20px;border-radius:999px;box-shadow:0 12px 30px rgba(0,0,0,.45);transition:all .25s;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--down);color:#fff}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand" aria-label="HoloScope">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="3" width="17" height="23" rx="3.5" fill="#7D6BFF" transform="rotate(-10 12 14)"/><circle cx="19" cy="17" r="8.5" fill="#0D0E14" stroke="#fff" stroke-width="3"/><circle cx="19" cy="17" r="4.2" fill="#FF4757"/><path d="M25 23.5l4.5 4.5" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/></svg>
    <span>Holo<b>Scope</b></span>
  </div>
  <div class="spacer"></div>
  <button class="icon-btn" id="settingsBtn" aria-label="Settings">

<script>
'use strict';
/* =========================================================
   HoloScope — scan cards, see prices, track a collection.
   Data: TCGdex (card info + TCGplayer prices, free, no key)
         PokemonPriceTracker (graded + history, free key)
   Storage: on this phone + optional private GitHub repo.
   ========================================================= */

/* ---------- tiny helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = x => (x === null || x === undefined || x === '' || Number.isNaN(Number(x))) ? null : Number(x);
const money = v => v == null ? '—' : '$' + Number(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const today = () => new Date().toISOString().slice(0, 10);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const HOUR = 3600e3, DAY = 24 * HOUR;

function ago(ts) {
  if (!ts) return 'never';
  const s = (Date.now() - ts) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return Math.round(s / 60) + ' min ago';
  if (s < 86400) return Math.round(s / 3600) + ' hr ago';
  return Math.round(s / 86400) + ' days ago';
}
function fmtDate(d) {
  if (!d) return '—';
  const t = new Date(String(d).length <= 10 ? d + 'T12:00:00' : d);
  return isNaN(t) ? String(d) : t.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}
function deltaHTML(now, then, cls = '') {
  if (now == null || then == null || then <= 0) return '';
  const pct = (now - then) / then * 100;
  if (Math.abs(pct) < 0.5) return `<span class="delta flat ${cls}">• 0%</span>`;
  const up = pct > 0;
  return `<span class="delta ${up ? 'up' : 'down'} ${cls}">${up ? '▲' : '▼'} ${Math.abs(pct).toFixed(Math.abs(pct) < 10 ? 1 : 0)}%</span>`;
}
async function pool(items, n, fn) {
  let i = 0;
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => {
    while (i < items.length) { const it = items[i++]; await fn(it); }
  }));
}
let toastT;
function toast(msg, err = false) {
  const t = $('#toast');
  t.textContent = msg; t.classList.toggle('err', err); t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600);
}
const PLACEHOLDER = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 63 88"><rect width="63" height="88" rx="5" fill="#212435"/><rect x="5" y="5" width="53" height="78" rx="3" fill="none" stroke="#2f3350" stroke-width="2"/><text x="31.5" y="52" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#4a5070">?</text></svg>`);
const img = (base, q = 'high') => base ? `${base}/${q}.webp` : PLACEHOLDER;

/* ---------- storage ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); }
    catch { // full? clear the throwaway cache and try once more
      Object.keys(localStorage).filter(x => x.startsWith('hs.c.')).forEach(x => localStorage.removeItem(x));
      try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { console.warn('storage full', e); }
    }
  }
};
const cache = {
  get(k) { const e = store.get('hs.c.' + k); if (!e) return null; if (Date.now() > e.exp) { localStorage.removeItem('hs.c.' + k); return null; } return e.v; },
  set(k, v, ttl) { store.set('hs.c.' + k, { v, exp: Date.now() + ttl }); },
  del(k) { localStorage.removeItem('hs.c.' + k); }
};
let settings = Object.assign({ ghToken: '', ghRepo: '', ghPath: 'collection.json', pptKey: '' }, store.get('hs.settings', {}));
let coll = store.get('hs.collection', null) || { version: 1, updatedAt: 0, cards: [] };
if (!Array.isArray(coll.cards)) coll.cards = [];
const ui = Object.assign({ sort: 'new', set: 'all', q: '' }, store.get('hs.ui', {}));

async function getJSON(url, opts = {}) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), opts.timeout || 20000);
  try {
    const r = await fetch(url, { ...opts, signal: ctl.signal });
    if (!r.ok) { const e = new Error('HTTP ' + r.status); e.status = r.status; throw e; }
    return await r.json();
  } finally { clearTimeout(t); }
}

/* =========================================================
   TCGdex — card info + TCGplayer prices
   ========================================================= */
const TD = 'https://api.tcgdex.net/v2/en';
const mem = new Map();
async function tdCard(id, fresh = false) {
  if (!fresh && mem.has(id)) return mem.get(id);
  let c = fresh ? null : cache.get('card:' + id);
  if (!c) { c = await getJSON(`${TD}/cards/${encodeURIComponent(id)}`); cache.set('card:' + id, c, 6 * HOUR); }
  mem.set(id, c);
  return c;
}
let setMap = null;
async function getSetMap() {
  if (setMap) return setMap;
  let s = cache.get('sets');
  if (!s) { s = await getJSON(`${TD}/sets`); cache.set('sets', s, 3 * DAY); }
  setMap = new Map(s.map((x, i) => [x.id, { ...x, order: i }]));
  return setMap;
}
async function tdSetInfo(id) {
  let s = cache.get('set:' + id);
  if (!s) {
    const f = await getJSON(`${TD}/sets/${encodeURIComponent(id)}`);
    s = { releaseDate: f.releaseDate, name: f.name, serie: f.serie?.name };
    cache.set('set:' + id, s, 7 * DAY);
  }
  return s;
}
const tdSearchName = name => getJSON(`${TD}/cards?name=${encodeURIComponent(name)}&pagination:itemsPerPage=120`);
async function tdSearchNumber(n) {
  const forms = [...new Set([String(n), String(n).padStart(2, '0'), String(n).padStart(3, '0')])];
  const res = await Promise.all(forms.map(f => getJSON(`${TD}/cards?localId=eq:${encodeURIComponent(f)}`).catch(() => [])));
  return res.flat();
}
const setIdOf = id => String(id).slice(0, String(id).lastIndexOf('-'));
const numOf = localId => parseInt(String(localId ?? '').replace(/^\D+/, ''), 10);
function fmtNumber(card) {
  const off = card?.set?.cardCount?.official;
  return off ? `${card.localId}/${String(off).padStart(String(card.localId).length, '0')}` : `#${card?.localId ?? ''}`;
}

/* printing names → friendly labels */
const VAR_LABEL = {
  'normal': 'Normal', 'holofoil': 'Holo', 'holo': 'Holo', 'reverse-holofoil': 'Reverse Holo', 'reverse': 'Reverse Holo',
  '1st-edition': '1st Edition', '1st-edition-normal': '1st Edition', '1st-edition-holofoil': '1st Edition Holo',
  'unlimited': 'Unlimited', 'unlimited-holofoil': 'Unlimited Holo', 'firstedition': '1st Edition'
};
const VAR_ORDER = ['Normal', 'Holo', 'Unlimited', 'Unlimited Holo', 'Reverse Holo', '1st Edition', '1st Edition Holo'];
function varLabel(k) {
  const key = String(k).toLowerCase().trim().replace(/[\s_]+/g, '-');
  return VAR_LABEL[key] || key.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}
const varRank = v => { const i = VAR_ORDER.indexOf(v.label); return (i < 0 ? 50 : i) + (v.market == null ? 100 : 0); };
function tcgVariants(card) {
  const out = new Map();
  const add = t => {
    if (!t || typeof t !== 'object') return;
    for (const [k, v] of Object.entries(t)) {
      if (!v || typeof v !== 'object') continue;
      const market = num(v.marketPrice), mid = num(v.midPrice), low = num(v.lowPrice), high = num(v.highPrice);
      if (market == null && mid == null && low == null && high == null) continue;
      const label = varLabel(k);
      if (!out.has(label)) out.set(label, { label, market: market ?? mid ?? low, low, high, productId: v.productId });
    }
  };
  add(card?.pricing?.tcgplayer);
  for (const vd of (card?.variants_detailed || card?.variantsDetailed || [])) add(vd?.pricing?.tcgplayer);
  return [...out.values()].sort((a, b) => varRank(a) - varRank(b));
}
function mainVariant(vars, label) { return (label && vars.find(v => v.label === label)) || vars[0] || null; }
function mainPrice(vars, label) { return mainVariant(vars, label)?.market ?? null; }
const tcgProductId = card => tcgVariants(card).find(v => v.productId)?.productId;

/* =========================================================
   PokemonPriceTracker — graded prices + history (free key)
   ========================================================= */
const PPT = 'https://www.pokemonpricetracker.com/api/v2';
function pickNum(x) {
  if (num(x) != null) return num(x);
  if (x && typeof x === 'object') {
    for (const k of ['market', 'marketPrice', 'averagePrice', 'avgPrice', 'average', 'avg', 'medianPrice', 'median', 'price', 'value'])
      if (num(x[k]) != null) return num(x[k]);
    if (x.smartMarketPrice) return pickNum(x.smartMarketPrice);
  }
  return null;
}
function normPpt(d) {
  const p = d.prices || {};
  const variants = [];
  const V = p.variants;
  if (Array.isArray(V)) {
    for (const it of V) {
      if (it.condition && !/near ?mint|^nm$/i.test(it.condition)) continue;
      const price = pickNum(it);
      if (price != null) variants.push({ label: varLabel(it.printing || it.variant || it.name || 'Normal'), price });
    }
  } else if (V && typeof V === 'object') {
    for (const [vk, vv] of Object.entries(V)) {
      const nm = vv?.['Near Mint'] ?? vv?.nearMint ?? vv?.NM ?? vv;
      const price = pickNum(nm);
      if (price != null) variants.push({ label: varLabel(vk), price });
    }
  }
  const sbg = d.ebay?.salesByGrade || {};
  const g = k => { const v = sbg[k]; return v == null ? null : { price: pickNum(v), count: num(v?.count ?? v?.salesCount ?? v?.sales) }; };
  let hist = d.priceHistory?.conditions?.['Near Mint']?.history || d.priceHistory?.history || (Array.isArray(d.priceHistory) ? d.priceHistory : []);
  hist = (hist || []).map(x => ({ d: String(x.date || x.d || '').slice(0, 10), p: num(x.market ?? x.price ?? x.p) })).filter(x => x.d && x.p != null);
  return {
    market: num(p.market), low: num(p.low ?? p.lowPrice), primary: p.primaryPrinting ? varLabel(p.primaryPrinting) : null,
    variants, psa8: g('psa8'), psa9: g('psa9'), psa10: g('psa10'), history: hist, updated: p.lastUpdated || null
  };
}
function pickPpt(arr, card) {
  const n = numOf(card.localId);
  let best = null, bs = -1;
  for (const d of arr) {
    let s = 0;
    if (String(d.name || '').toLowerCase() === String(card.name).toLowerCase()) s += 3;
    if (numOf(String(d.cardNumber || '').split('/')[0]) === n) s += 3;
    if (card.set?.name && String(d.setName || '').toLowerCase().includes(card.set.name.toLowerCase())) s += 2;
    if (s > bs) { bs = s; best = d; }
  }
  return bs >= 3 ? best : null;
}
async function pptFor(card, fresh = false) {
  if (!settings.pptKey) return { status: 'nokey' };
  const ck = 'ppt:' + card.id;
  if (!fresh) { const hit = cache.get(ck); if (hit) return hit; }
  const pid = tcgProductId(card);
  const q = pid ? `tcgPlayerId=${pid}`
    : `search=${encodeURIComponent(`${card.name} ${numOf(card.localId) || card.localId}${card.set?.cardCount?.official ? '/' + card.set.cardCount.official : ''}`)}&limit=5`;
  try {
    const r = await getJSON(`${PPT}/cards?${q}&includeEbay=true&includeHistory=true&days=90`,
      { headers: { Authorization: 'Bearer ' + settings.pptKey.trim() } });
    let d = r?.data;
    if (Array.isArray(d)) d = d.length === 1 && pid ? d[0] : pickPpt(d, card);
    const res = d ? { status: 'ok', ...normPpt(d) } : { status: 'notfound' };
    cache.set(ck, res, res.status === 'ok' ? DAY : 6 * HOUR);
    return res;
  } catch (e) {
    if (e.status === 401 || e.status === 403) return { status: 'badkey' };
    if (e.status === 429) return { status: 'limit' };
    if (e.status === 404) return { status: 'notfound' };
    return { status: 'error' };
  }
}

/* =========================================================
   GitHub sync — collection.json in a private repo
   ========================================================= */
const gh = { sha: null };
let syncState = 'off', syncMsg = '';
const ghOn = () => !!(settings.ghToken && /^[\w.-]+\/[\w.-]+$/.test(settings.ghRepo.trim()));
const b64enc = s => { const b = new TextEncoder().encode(s); let bin = ''; for (let i = 0; i < b.length; i += 0x8000) bin += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(bin); };
const b64dec = s => new TextDecoder().decode(Uint8Array.from(atob(String(s).replace(/\s/g, '')), c => c.charCodeAt(0)));
function ghErr(status) {
  const e = new Error(
    status === 401 ? 'GitHub token is wrong or expired' :
    status === 403 ? "Token can't write to that repo" :
    status === 404 ? 'Repo not found — check the name and token access' :
    'GitHub error ' + status);
  e.status = status; return e;
}
async function ghReq(method, body) {
  const path = (settings.ghPath || 'collection.json').trim().replace(/^\/+/, '').split('/').map(encodeURIComponent).join('/');
  return fetch(`https://api.github.com/repos/${settings.ghRepo.trim()}/contents/${path}`, {
    method, cache: 'no-store',
    headers: { Authorization: 'Bearer ' + settings.ghToken.trim(), Accept: 'application/vnd.github+json', ...(body ? { 'Content-Type': 'application/json' } : {}) },
    body: body ? JSON.stringify(body) : undefined
  });
}
async function ghPull() {
  const r = await ghReq('GET');
  if (r.status === 404) { gh.sha = null; return null; }
  if (!r.ok) throw ghErr(r.status);
  const j = await r.json();
  gh.sha = j.sha;
  return JSON.parse(b64dec(j.content || '') || 'null');
}
async function ghPush() {
  const body = { message: `HoloScope: ${coll.cards.length} cards`, content: b64enc(JSON.stringify(coll)) };
  if (gh.sha) body.sha = gh.sha;
  let r = await ghReq('PUT', body);
  if (r.status === 409 || r.status === 422) { // our copy of the file version is stale; grab it and retry
    const g = await ghReq('GET');
    gh.sha = g.ok ? (await g.json()).sha : null;
    if (gh.sha) body.sha = gh.sha; else delete body.sha;
    r = await ghReq('PUT', body);
  }
  if (!r.ok) throw ghErr(r.status);
  gh.sha = (await r.json()).content?.sha || null;
}
function setSync(s, msg = '') {
  syncState = s; syncMsg = msg;
  $('#syncDot').className = 'sync-dot ' + s;
  const el = $('#syncStatus');
  if (el) { el.className = 'status ' + s; el.innerHTML = '<i></i>' + esc(syncLabel()); }
}
function syncLabel() {
  return { off: 'Not set up — saved on this phone only', ok: 'Saved to GitHub ✓', syncing: 'Saving…', pending: 'Saving…', offline: 'Offline — will save when back online', error: 'Problem: ' + syncMsg }[syncState] || '';
}
async function syncNow() {
  if (!ghOn()) { setSync('off'); return; }
  if (!navigator.onLine) { setSync('offline'); return; }
  setSync('syncing');
  try {
    const remote = await ghPull();
    if (remote && Array.isArray(remote.cards) && (remote.updatedAt || 0) > (coll.updatedAt || 0)) {
      coll = remote; store.set('hs.collection', coll); renderCollection();
    } else if (!remote || (coll.updatedAt || 0) > (remote.updatedAt || 0)) {
      await ghPush();
    }
    setSync('ok');
  } catch (e) { setSync('error', e.message); }
}
let syncTimer;
function scheduleSync() {
  if (!ghOn()) return;
  clearTimeout(syncTimer); setSync('pending');
  syncTimer = setTimeout(async () => {
    if (!navigator.onLine) { setSync('offline'); return; }
    setSync('syncing');
    try { await ghPush(); setSync('ok'); } catch (e) { setSync('error', e.message); }
  }, 1500);
}
addEventListener('online', () => ghOn() && syncNow());

/* =========================================================
   Collection
   ========================================================= */
function saveColl(sync = true) {
  coll.updatedAt = Date.now();
  store.set('hs.collection', coll);
  if (sync) scheduleSync();
  renderCollection();
}
function pushHist(c, p) {
  c.history = c.history || [];
  const d = today(), last = c.history[c.history.length - 1];
  if (last && last.d === d) last.p = p; else c.history.push({ d, p });
  if (c.history.length > 120) c.history = c.history.slice(-120);
}
function addToColl(card, { variant, condition, grade, qty }) {
  const price = mainPrice(tcgVariants(card), variant);
  const ex = coll.cards.find(c => c.cardId === card.id && c.variant === variant && c.condition === condition && (c.grade || null) === (grade || null));
  if (ex) ex.qty += qty;
  else coll.cards.push({
    uid: uid(), cardId: card.id, name: card.name, setId: card.set?.id, setName: card.set?.name, number: fmtNumber(card),
    image: card.image || null, rarity: card.rarity || null, variant, condition, grade: grade || null, qty,
    addedAt: Date.now(), priceAtAdd: price, price, priceUpdatedAt: Date.now(), history: price != null ? [{ d: today(), p: price }] : []
  });
  saveColl();
}
let refreshing = false;
async function refreshPrices(force = false) {
  if (refreshing || !navigator.onLine) return;
  const stale = coll.cards.filter(c => force || Date.now() - (c.priceUpdatedAt || 0) > 12 * HOUR);
  if (!stale.length) { if (force) toast('Prices are up to date'); return; }
  refreshing = true; renderCollection();
  let changed = 0;
  await pool([...new Set(stale.map(c => c.cardId))], 4, async id => {
    try {
      const vars = tcgVariants(await tdCard(id, true));
      for (const c of coll.cards.filter(x => x.cardId === id)) {
        const p = mainPrice(vars, c.variant);
        c.priceUpdatedAt = Date.now();
        if (p != null) { c.price = p; pushHist(c, p); changed++; }
      }
    } catch { /* keep old price */ }
  });
  refreshing = false;
  coll.pricesAt = Date.now();
  saveColl();
  if (force) toast(changed ? 'Prices updated!' : "Couldn't reach the price server", !changed);
}
const condLabel = c => c.condition === 'graded' ? (c.grade || 'Graded') : c.condition === 'played' ? 'Played' : 'Like new';

function renderCollection() {
  const v = $('#view-collection');
  const cards = coll.cards;
  if (!cards.length) {
    v.innerHTML = `
      <div class="empty">
        <svg viewBox="0 0 160 160" aria-hidden="true">

          <rect x="30" y="28" width="62" height="88" rx="9" fill="#212435" transform="rotate(-12 61 72)"/>

          <circle cx="104" cy="104" r="26" fill="#0D0E14" stroke="#fff" stroke-width="7"/>
          <circle cx="104" cy="104" r="11" fill="#FF4757"/>
          <path d="M123 124l14 14" stroke="#fff" stroke-width="9" stroke-linecap="round"/>

      </div>`;
    return;
  }
  const total = cards.reduce((s, c) => s + (c.price || 0) * c.qty, 0);
  const base = cards.reduce((s, c) => s + (c.price != null && c.priceAtAdd != null ? c.priceAtAdd * c.qty : 0), 0);
  const nowComparable = cards.reduce((s, c) => s + (c.price != null && c.priceAtAdd != null ? c.price * c.qty : 0), 0);
  const count = cards.reduce((s, c) => s + c.qty, 0);
  const diff = nowComparable - base;
  const sets = [...new Map(cards.filter(c => c.setId).map(c => [c.setId, c.setName || c.setId])).entries()].sort((a, b) => a[1].localeCompare(b[1]));
  if (ui.set !== 'all' && !sets.some(s => s[0] === ui.set)) ui.set = 'all';

  const q = ui.q.trim().toLowerCase();
  let list = cards.filter(c => (ui.set === 'all' || c.setId === ui.set) && (!q || `${c.name} ${c.setName} ${c.number}`.toLowerCase().includes(q)));
  const sorters = {
    new: (a, b) => b.addedAt - a.addedAt,
    high: (a, b) => (b.price ?? -1) - (a.price ?? -1),
    low: (a, b) => (a.price ?? 1e9) - (b.price ?? 1e9),
    name: (a, b) => a.name.localeCompare(b.name),
    set: (a, b) => (a.setName || '').localeCompare(b.setName || '') || numOf(a.number) - numOf(b.number)
  };
  list.sort(sorters[ui.sort] || sorters.new);

  const lastAt = Math.max(...cards.map(c => c.priceUpdatedAt || 0));
  v.innerHTML = `
    <div class="worth">
      <div class="label">My cards are worth</div>
      <div class="big">${money(total)}</div>
      <div class="row">
        ${base > 0 ? `<span class="delta ${diff > 0.004 ? 'up' : diff < -0.004 ? 'down' : 'flat'}">${diff > 0.004 ? '▲' : diff < -0.004 ? '▼' : '•'} ${money(Math.abs(diff))}</span><span class="small">since you added them</span>` : ''}
      </div>
      <div class="row small" style="margin-top:8px">${count} card${count === 1 ? '' : 's'} · ${cards.length} different · prices ${ago(lastAt)}</div>
      <button class="icon-btn refresh ${refreshing ? 'spin' : ''}" id="refreshBtn" aria-label="Update prices">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg>
      </button>
    </div>
    <div class="controls">
      <div class="searchbox">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="collQ" type="search" placeholder="Search my cards" value="${esc(ui.q)}" autocomplete="off">
        <select id="collSort" aria-label="Sort">
          <option value="new">Newest</option><option value="high">$ High</option><option value="low">$ Low</option>
          <option value="name">A–Z</option><option value="set">By set</option>
        </select>

      ${sets.length > 1 ? `<div class="chips scroll" id="setChips">
        <button class="chip ${ui.set === 'all' ? 'on' : ''}" data-set="all">All sets</button>
        ${sets.map(([id, name]) => `<button class="chip ${ui.set === id ? 'on' : ''}" data-set="${esc(id)}">${esc(name)}</button>`).join('')}
      </div>` : ''}
    </div>
    ${list.length ? `<div class="grid">${list.map((c, i) => `
      <button class="tile" data-card="${esc(c.cardId)}" style="animation-delay:${Math.min(i, 12) * 25}ms">
        ${c.qty > 1 ? `<span class="qty">×${c.qty}</span>` : ''}
        ${c.condition !== 'likenew' ? `<span class="cond ${c.condition === 'graded' ? 'graded' : ''}">${esc(condLabel(c))}</span>` : ''}
        <div class="art"><img loading="lazy" src="${img(c.image, 'low')}" alt="" onerror="this.src='${PLACEHOLDER}'"></div>
        <div class="name">${esc(c.name)}</div>
        <div class="sub">${esc(c.setName || '')} · ${esc(c.variant || '')}</div>
        <div class="price"><b>${money(c.price)}</b>${deltaHTML(c.price, c.priceAtAdd)}</div>
      </button>`).join('')}</div>`
      : `<div class="empty" style="padding-top:10px"><p>No cards match that.</p></div>`}
  `;
  $('#collSort').value = ui.sort;
}
$('#view-collection').addEventListener('click', e => {
  const t = e.target.closest('[data-card],[data-set],#refreshBtn,[data-go]');

/* =========================================================
   Layers: detail page + bottom sheet (Android back works)
   ========================================================= */
const layers = [];
function pushLayer(name) { layers.push(name); history.pushState({ hs: layers.length }, ''); if (name === 'detail') stopCam(); }
function hideLayer(name) {
  if (name === 'detail') { $('#detail').classList.remove('open'); $('#detail').setAttribute('aria-hidden', 'true'); detailId = null; renderCollection(); if (currentTab === 'scan' && !layers.includes('detail')) startCam(); }
  if (name === 'sheet') { $('#sheet').classList.remove('open'); $('#scrim').classList.remove('open'); sheetOnClose?.(); sheetOnClose = null; }
}
addEventListener('popstate', e => { const depth = e.state?.hs ?? 0; while (layers.length > depth) hideLayer(layers.pop()); });
function closeAllThen(fn) {
  if (!layers.length) { fn(); return; }
  sheetOnClose = null;
  addEventListener('popstate', () => setTimeout(fn, 30), { once: true });
  history.go(-layers.length);
}
function closeTop() { if (layers.length) history.back(); }
$('#detailBack').onclick = closeTop;
$('#sheetClose').onclick = closeTop;
$('#scrim').onclick = closeTop;

let sheetOnClose = null;
function openSheet(title, body, foot = '', onClose = null) {
  $('#sheetTitle').textContent = title;
  $('#sheetBody').innerHTML = body;
  $('#sheetFoot').innerHTML = foot;
  $('#sheetFoot').hidden = !foot;
  $('#sheetBody').scrollTop = 0;
  if (layers[layers.length - 1] !== 'sheet') {
    pushLayer('sheet');
    requestAnimationFrame(() => { $('#sheet').classList.add('open'); $('#scrim').classList.add('open'); });
  }
  sheetOnClose = onClose;
}
/* close the sheet, then run fn once the back-navigation has settled */
function closeSheetThen(fn) {
  if (layers[layers.length - 1] !== 'sheet') { fn(); return; }
  sheetOnClose = null;
  addEventListener('popstate', () => setTimeout(fn, 30), { once: true });
  history.back();
}

/* =========================================================
   Card detail page
   ========================================================= */
let detailId = null;
async function openDetail(cardId) {
  detailId = cardId;
  const owned = coll.cards.find(c => c.cardId === cardId);
  $('#detailTitle').textContent = owned?.name || '';
  $('#detailBody').innerHTML = `<div class="hero"><img src="${owned ? img(owned.image) : PLACEHOLDER}" alt=""></div><div style="text-align:center"><span class="skel" style="width:160px;height:28px"></span></div>`;
  $('#detailFoot').innerHTML = '';
  if (layers[layers.length - 1] !== 'detail') {
    pushLayer('detail');
    $('#detail').setAttribute('aria-hidden', 'false');
    requestAnimationFrame(() => $('#detail').classList.add('open'));
  }
  $('#detailBody').scrollTop = 0;
  let card;
  try { card = await tdCard(cardId); }
  catch {
    if (detailId !== cardId) return;
    $('#detailBody').innerHTML = `<div class="empty"><h2>Can't load this card</h2><p>Check your internet and try again.</p><button class="btn" id="retryDetail">Try again</button></div>`;
    $('#retryDetail').onclick = () => openDetail(cardId);
    return;
  }
  if (detailId !== cardId) return;
  renderDetail(card);
  // slower extras
  if (card.set?.id) tdSetInfo(card.set.id).then(s => { const el = $('#relDate'); if (el && detailId === cardId) el.textContent = fmtDate(s.releaseDate); }).catch(() => {});
  loadPpt(card);
}

function renderDetail(card) {
  const vars = tcgVariants(card);

  const mv = mainVariant(vars, mine[0]?.variant);

  $('#detailBody').innerHTML = `
    <div style="position:relative"><div class="glow"></div></div>

    <h1 class="d-name">${esc(card.name)}</h1>
    <div class="d-chips">
      <span class="tag red">${esc(card.set?.name || 'Unknown set')}</span>
      <span class="tag">${esc(fmtNumber(card))}</span>
      ${card.rarity ? `<span class="tag">${esc(card.rarity)}</span>` : ''}
    </div>
    <div class="worth-line">
      <div class="k">Worth about</div>
      <div class="v">${money(mv?.market)}</div>
      <div class="s">${mv ? `${esc(mv.label)} · TCGplayer market price` : 'No price found for this card yet'}</div>

        <dt>Set</dt><dd>${esc(card.set?.name || '—')}</dd>
        <dt>Number</dt><dd>${esc(fmtNumber(card))}</dd>
        <dt>Rarity</dt><dd>${esc(card.rarity || '—')}</dd>
        <dt>Artist</dt><dd>${esc(card.illustrator || '—')}</dd>
        <dt>Released</dt><dd id="relDate"><span class="skel"></span></dd>
        ${card.hp ? `<dt>HP</dt><dd>${esc(card.hp)}</dd>` : ''}
        ${card.types?.length ? `<dt>Type</dt><dd>${esc(card.types.join(', '))}</dd>` : ''}
      </dl>

    <p class="note" style="text-align:center">TCGplayer prices ${card.pricing?.tcgplayer?.updated ? 'updated ' + fmtDate(card.pricing.tcgplayer.updated) : ''} via TCGdex</p>
  `;
  $('#detailFoot').innerHTML = `<button class="btn primary block" id="addBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    ${mine.length ? 'Add another' : 'Add to my cards'}</button>`;

function ownedPanel(mine) {
  return `<div class="panel" id="ownedPanel">
    <h3>⭐ In my collection</h3>
    ${mine.map(c => `<div class="own-row" data-uid="${esc(c.uid)}">
      <div class="what">${esc(c.variant)} · ${esc(condLabel(c))}<small>${money(c.price)} each ${deltaHTML(c.price, c.priceAtAdd)}</small></div>
      <div class="stepper"><button data-act="minus" aria-label="One less">−</button><span>${c.qty}</span><button data-act="plus" aria-label="One more">+</button></div>
      <button class="del" data-act="del" aria-label="Remove"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>
    </div>`).join('')}
  </div>`;
}
function wireOwned(card) {
  const p = $('#ownedPanel'); if (!p) return;
  p.onclick = e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const row = b.closest('[data-uid]'); const c = coll.cards.find(x => x.uid === row.dataset.uid); if (!c) return;
    const act = b.dataset.act;
    if (act === 'plus') { c.qty++; }
    else if (act === 'minus') { if (c.qty > 1) c.qty--; else return; }
    else if (act === 'del') {
      if (!b.classList.contains('confirm')) { b.classList.add('confirm'); b.textContent = 'Remove?'; setTimeout(() => b.isConnected && renderDetail(card), 3000); return; }
      coll.cards = coll.cards.filter(x => x !== c); toast('Removed');
    }
    saveColl();
    renderDetail(card);
    loadPpt(card);
  };
}

let pptReq = 0;
async function loadPpt(card) {
  const my = ++pptReq;
  const ppt = await pptFor(card);
  if (my !== pptReq || detailId !== card.id) return;
  const vars = tcgVariants(card);
  $('#priceTable').innerHTML = priceTable(vars, ppt);
  const mine = coll.cards.find(c => c.cardId === card.id);
  $('#chartBox').innerHTML = chartHTML(historyFor(card, ppt, mainVariant(vars, mine?.variant)?.label));
}

function priceTable(vars, ppt) {
  const loading = ppt.status === 'loading';
  const pptOk = ppt.status === 'ok';
  const pptCell = val => {
    if (loading) return '<span class="skel"></span>';
    if (pptOk) return val == null ? '<span class="muted">—</span>' : money(val);
    return '<span class="muted">—</span>';
  };
  // ungraded rows: union of printings from both sources
  const labels = [...new Set([...vars.map(v => v.label), ...(pptOk ? ppt.variants.map(v => v.label) : [])])];
  if (!labels.length && pptOk && ppt.market != null) labels.push(ppt.primary || 'Normal');
  const pptUngraded = label => {
    if (!pptOk) return null;
    const v = ppt.variants.find(x => x.label === label);
    if (v) return v.price;
    if (!ppt.variants.length && (ppt.primary ? ppt.primary === label : label === labels[0])) return ppt.market;
    return null;
  };
  const rows = labels.map(label => {
    const t = vars.find(v => v.label === label);
    const range = t && t.low != null && t.high != null ? `${money(t.low)} – ${money(t.high)}` : '';
    return `<tr><td><span class="lbl">${esc(label)}</span><span class="sub">Ungraded${range ? ' · ' + range : ''}</span></td>
      <td class="${t?.market == null ? 'na' : ''}">${t?.market == null ? '—' : money(t.market)}</td>
      <td>${pptCell(pptUngraded(label))}</td></tr>`;
  }).join('') || `<tr><td><span class="lbl">Ungraded</span></td><td class="na">—</td><td>${pptCell(null)}</td></tr>`;
  const gradeRow = (k, name) => {
    const g = pptOk ? ppt[k] : null;
    return `<tr class="grade"><td><span class="lbl">${name}</span><span class="sub">Graded${g?.count ? ` · ${g.count} sales` : ''}</span></td>
      <td class="na">—</td><td>${pptCell(g?.price ?? null)}</td></tr>`;
  };
  const msg = {
    nokey: `Add a free PriceTracker key in <a href="#" class="mini-link" data-open-settings>Settings</a> to see graded prices.`,
    badkey: `Your PriceTracker key didn't work. Check it in <a href="#" class="mini-link" data-open-settings>Settings</a>.`,
    limit: `PriceTracker's free daily limit is used up — it resets tomorrow.`,
    notfound: `PriceTracker doesn't have this card.`,
    error: `Couldn't reach PriceTracker right now.`
  }[ppt.status];
  return `<table class="pt">
    <thead><tr><th>Kind</th><th>TCGplayer</th><th>Tracker</th></tr></thead>
    <tbody>${rows}${gradeRow('psa9', 'PSA 9')}${gradeRow('psa10', 'PSA 10')}</tbody>
  </table>${msg ? `<p class="note">${msg}</p>` : ''}`;
}
$('#detailBody').addEventListener('click', e => { if (e.target.closest('[data-open-settings]')) { e.preventDefault(); openSettings(); } });

function historyFor(card, ppt, label) {
  const m = new Map();
  if (ppt?.status === 'ok' && (!ppt.primary || !label || ppt.primary === label)) for (const h of ppt.history) m.set(h.d, h.p);
  const own = coll.cards.find(c => c.cardId === card.id && (!label || c.variant === label)) || coll.cards.find(c => c.cardId === card.id);
  for (const h of own?.history || []) m.set(h.d, h.p);
  return [...m.entries()].map(([d, p]) => ({ d, p })).sort((a, b) => a.d.localeCompare(b.d));
}
function chartHTML(pts) {
  if (pts.length < 2) return `<div class="chart-empty">📅 Not enough history yet.<br><span class="small">Save this card and HoloScope will track its price every day.</span></div>`;
  const W = 340, H = 186, pl = 6, pr = 6, pt = 26, pb = 42;
  const ps = pts.map(x => x.p);
  let min = Math.min(...ps), max = Math.max(...ps);
  if (max - min < 0.01) { max += 1; min = Math.max(0, min - 1); }
  const t0 = Date.parse(pts[0].d), t1 = Date.parse(pts[pts.length - 1].d);
  const X = d => pl + ((Date.parse(d) - t0) / Math.max(1, t1 - t0)) * (W - pl - pr);
  const Y = p => pt + (1 - (p - min) / (max - min)) * (H - pt - pb);
  const line = pts.map((x, i) => `${i ? 'L' : 'M'}${X(x.d).toFixed(1)},${Y(x.p).toFixed(1)}`).join('');
  const area = `${line}L${X(pts[pts.length - 1].d).toFixed(1)},${H - pb}L${X(pts[0].d).toFixed(1)},${H - pb}Z`;
  const first = pts[0].p, last = pts[pts.length - 1].p, up = last >= first;
  const col = up ? '#2FD585' : '#FF6B7A';
  const days = Math.max(1, Math.round((t1 - t0) / DAY));
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin:-4px 0 6px;font-weight:800">
      <span class="muted small">Last ${days} day${days === 1 ? '' : 's'}</span>
      <span class="delta ${Math.abs(last - first) < 0.005 ? 'flat' : up ? 'up' : 'down'}">${up ? '▲' : '▼'} ${money(Math.abs(last - first))}</span>
    </div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Price history">
      <defs><linearGradient id="cg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".35"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
      <line x1="${pl}" x2="${W - pr}" y1="${Y(max)}" y2="${Y(max)}" stroke="rgba(255,255,255,.07)" stroke-dasharray="4 5"/>
      <line x1="${pl}" x2="${W - pr}" y1="${Y(min)}" y2="${Y(min)}" stroke="rgba(255,255,255,.07)" stroke-dasharray="4 5"/>
      <text x="${pl}" y="${Y(max) - 7}" fill="#9298B3" font-size="11.5" font-weight="700" font-family="Nunito, sans-serif">High ${money(max)}</text>
      <text x="${pl}" y="${Y(min) + 15}" fill="#9298B3" font-size="11.5" font-weight="700" font-family="Nunito, sans-serif">Low ${money(min)}</text>
      <path d="${area}" fill="url(#cg)"/>
      <path d="${line}" fill="none" stroke="${col}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${X(pts[pts.length - 1].d)}" cy="${Y(last)}" r="5.5" fill="${col}" stroke="#181A25" stroke-width="3"/>
      <text x="${pl}" y="${H - 4}" fill="#646A86" font-size="11" font-weight="700" font-family="Nunito, sans-serif">${fmtDate(pts[0].d)}</text>
      <text x="${W - pr}" y="${H - 4}" text-anchor="end" fill="#646A86" font-size="11" font-weight="700" font-family="Nunito, sans-serif">${fmtDate(pts[pts.length - 1].d)}</text>
    </svg>`;
}

   Scanning: camera → OCR (name + number) → match → confirm

let stream = null, torchOn = false, busy = false;
async function startCam() {
  if (stream || busy) return;
  if (!navigator.mediaDevices?.getUserMedia) { camMessage('nocam'); return; }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
    if (currentTab !== 'scan') { stopCam(); return; }
    const v = $('#cam'); v.srcObject = stream; await v.play().catch(() => {});
    const track = stream.getVideoTracks()[0];
    const caps = track.getCapabilities?.() || {};
    $('#torchBtn').hidden = !caps.torch;
    if (caps.focusMode?.includes('continuous')) track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
    $('#camMsg').hidden = true;
  } catch (e) {
    stream = null;
    camMessage(e?.name === 'NotAllowedError' ? 'denied' : 'nocam');
  }
}
function stopCam() {
  stream?.getTracks().forEach(t => t.stop());
  stream = null; torchOn = false; $('#torchBtn').classList.remove('on');
}
function camMessage(kind, extra = {}) {
  const m = $('#camMsg');
  const photoBtn = `<button class="btn" data-cm="photo">🖼️ Use a photo instead</button>`;
  const html = {
    denied: `<div><div style="font-size:54px">📷</div><h2>Camera is blocked</h2><p>HoloScope needs the camera to scan cards. Tap the lock icon by the web address (or Chrome ⋮ → Settings → Site settings → Camera) and allow it.</p><div class="stack"><button class="btn primary" data-cm="retry">Try again</button>${photoBtn}</div></div>`,
    nocam: `<div><div style="font-size:54px">📷</div><h2>No camera found</h2><p>You can still pick a photo of a card, or search by name.</p><div class="stack">${photoBtn}<button class="btn" data-cm="type">Search by name</button></div></div>`,
    loading: `<div style="width:min(320px,100%)"><div style="font-size:54px">🔍</div><h2>Getting the card reader ready…</h2><p>This only happens the first time.</p><div class="progress"><i id="ocrBar" style="width:${extra.pct || 3}%"></i></div></div>`
  }[kind];
  m.innerHTML = html; m.hidden = false;
}
$('#camMsg').addEventListener('click', e => {
  const b = e.target.closest('[data-cm]'); if (!b) return;
  if (b.dataset.cm === 'retry') { $('#camMsg').hidden = true; startCam(); }
  if (b.dataset.cm === 'photo') $('#photoInput').click();
  if (b.dataset.cm === 'type') setTab('search');
});
$('#torchBtn').onclick = async () => {
  const track = stream?.getVideoTracks()[0]; if (!track) return;
  torchOn = !torchOn;
  try { await track.applyConstraints({ advanced: [{ torch: torchOn }] }); } catch { torchOn = false; }
  $('#torchBtn').classList.toggle('on', torchOn);
};
$('#typeBtn').onclick = () => setTab('search');
$('#photoBtn').onclick = () => $('#photoInput').click();
$('#photoInput').onchange = async e => {
  const f = e.target.files?.[0]; e.target.value = '';
  if (!f) return;
  const bmp = await createImageBitmap(f).catch(() => null);
  if (!bmp) { toast("Couldn't open that photo", true); return; }
  // fit card-shaped crop from the centre of the photo
  const ar = 63 / 88;
  let sw = bmp.width, sh = bmp.height;
  if (sw / sh > ar) sw = sh * ar; else sh = sw / ar;
  const c = document.createElement('canvas');
  c.width = Math.min(1400, Math.round(sw)); c.height = Math.round(c.width / ar);
  c.getContext('2d').drawImage(bmp, (bmp.width - sw) / 2, (bmp.height - sh) / 2, sw, sh, 0, 0, c.width, c.height);
  processCapture(c);
};

function grabFrame() {
  const v = $('#cam');
  if (!v.videoWidth) return null;
  const box = $('#camBox').getBoundingClientRect(), fr = $('#frame').getBoundingClientRect();
  const vw = v.videoWidth, vh = v.videoHeight;
  const s = Math.max(box.width / vw, box.height / vh);
  const dx = (box.width - vw * s) / 2, dy = (box.height - vh * s) / 2;
  // a little margin around the frame so edges aren't clipped
  const m = 0.03;
  let sx = (fr.left - box.left - dx) / s - fr.width / s * m, sy = (fr.top - box.top - dy) / s - fr.height / s * m;
  let sw = fr.width / s * (1 + 2 * m), sh = fr.height / s * (1 + 2 * m);
  sx = Math.max(0, sx); sy = Math.max(0, sy); sw = Math.min(vw - sx, sw); sh = Math.min(vh - sy, sh);
  const c = document.createElement('canvas');
  c.width = Math.round(Math.max(sw, 900)); c.height = Math.round(c.width * sh / sw);
  const g = c.getContext('2d'); g.imageSmoothingQuality = 'high';
  g.drawImage(v, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return c;
}

/* crop a region, upscale, grayscale + contrast stretch (optionally inverted) */
function region(src, x, y, w, h, targetW, invert = false) {
  const sx = src.width * x, sy = src.height * y, sw = src.width * w, sh = src.height * h;
  const k = Math.max(1, targetW / sw);
  const c = document.createElement('canvas');
  c.width = Math.round(sw * k); c.height = Math.round(sh * k);
  const g = c.getContext('2d', { willReadFrequently: true });
  g.imageSmoothingQuality = 'high';
  g.drawImage(src, sx, sy, sw, sh, 0, 0, c.width, c.height);
  const im = g.getImageData(0, 0, c.width, c.height), d = im.data;
  const hist = new Uint32Array(256), L = new Uint8ClampedArray(d.length / 4);
  for (let i = 0, j = 0; i < d.length; i += 4, j++) { const l = (d[i] * 299 + d[i + 1] * 587 + d[i + 2] * 114) / 1000 | 0; L[j] = l; hist[l]++; }
  const n = L.length; let lo = 0, hi = 255, acc = 0;
  for (let i = 0; i < 256; i++) { acc += hist[i]; if (acc > n * 0.02) { lo = i; break; } }
  acc = 0; for (let i = 255; i >= 0; i--) { acc += hist[i]; if (acc > n * 0.02) { hi = i; break; } }
  const range = Math.max(1, hi - lo);
  for (let i = 0, j = 0; i < d.length; i += 4, j++) {
    let v = (L[j] - lo) * 255 / range; v = v < 0 ? 0 : v > 255 ? 255 : v;
    if (invert) v = 255 - v;
    d[i] = d[i + 1] = d[i + 2] = v;
  }
  g.putImageData(im, 0, 0);
  return c;
}

let ocrWorker = null, ocrLoading = null;
function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
}
async function getOCR() {
  if (ocrWorker) return ocrWorker;
  if (!ocrLoading) {
    ocrLoading = (async () => {
      if (!window.Tesseract) await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
      return Tesseract.createWorker('eng', 1, {
        logger: m => { const bar = $('#ocrBar'); if (bar && m.progress != null && /load|initial/i.test(m.status)) bar.style.width = Math.max(3, Math.round(m.progress * 100)) + '%'; }
      });
    })().catch(e => { ocrLoading = null; throw e; });
  }
  ocrWorker = await ocrLoading;
  return ocrWorker;
}
async function ocr(canvas, psm, whitelist = '') {
  const w = await getOCR();
  await w.setParameters({ tessedit_pageseg_mode: psm, tessedit_char_whitelist: whitelist });
  const { data } = await w.recognize(canvas);
  return data.text || '';
}
function parseNum(t) {
  const m = String(t).replace(/[|\\]/g, '/').match(/(\d{1,3})\s*\/\s*(\d{2,3})/);
  return m ? { n: parseInt(m[1], 10), total: parseInt(m[2], 10) } : null;
}

const STOP = new Set(['basic', 'stage', 'stagel', 'stage1', 'stage2', 'hp', 'evolves', 'evolve', 'from', 'put', 'this', 'card', 'on', 'the', 'and', 'pokemon', 'pokémon', 'trainer', 'item', 'supporter', 'stadium', 'tool', 'ability', 'weakness', 'resistance', 'retreat', 'lv', 'level', 'restored', 'tera', 'rule']);
const SUFFIX = new Set(['ex', 'gx', 'v', 'vmax', 'vstar', 'break', 'prime', 'lvx']);
function nameCandidates(txt) {
  const words = [];
  for (const line of String(txt).split('\n')) {
    if (/evolve|from|put\s|stage|trainer|supporter/i.test(line)) continue; // "Evolves from X" names the wrong card
    for (let w of line.split(/\s+/)) {
      w = w.replace(/[^A-Za-zÀ-ÿ'’.\-]/g, '').replace(/^[.\-']+|[.\-']+$/g, '');
      if (!w) continue;
      const lw = w.toLowerCase().replace(/[.’'\-]/g, '');
      if (STOP.has(lw)) continue;
      if (w.length >= 3 || SUFFIX.has(lw)) words.push(w);
    }
  }
  const c = [];
  const firstReal = words.findIndex(w => w.length >= 3 && !SUFFIX.has(w.toLowerCase()));
  if (firstReal >= 0) {
    const run = words.slice(firstReal, firstReal + 3);
    c.push(run.join(' '), run.slice(0, 2).join(' '), run[0]);
  }
  const longest = [...words].sort((a, b) => b.length - a.length);
  for (const w of longest) if (w.length >= 4) c.push(w);
  // misread letters? search by the start of the word and let fuzzy matching pick
  for (const w of longest.slice(0, 2)) if (w.length >= 5) c.push(w.slice(0, 4));
  return [...new Set(c.map(s => s.trim()).filter(s => s.length >= 3))].slice(0, 6);
}
function lev(a, b) {
  a = a.toLowerCase(); b = b.toLowerCase();
  const dp = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    let prev = dp[0]; dp[0] = i;
    for (let j = 1; j <= b.length; j++) { const t = dp[j]; dp[j] = Math.min(dp[j] + 1, dp[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = t; }
  }
  return dp[b.length];
}
const sim = (a, b) => { if (!a || !b) return 0; const m = Math.max(a.length, b.length); return 1 - lev(a, b) / m; };
function nameScore(cardName, ocrText, cands) {
  const n = cardName.toLowerCase(), t = ocrText.toLowerCase();
  if (t.includes(n)) return 1;
  let best = 0;
  for (const c of cands) best = Math.max(best, sim(n, c), sim(n.split(' ')[0], c.split(' ')[0]) * 0.9);
  return best;
}

async function identify(nameTxt, num) {
  const sets = await getSetMap().catch(() => new Map());
  const cands = nameCandidates(nameTxt);
  let byName = [];
  for (const nm of cands) {
    try { const r = await tdSearchName(nm); if (r?.length) { byName = r; break; } } catch { }
  }
  let byNum = [];
  if (num && !byName.some(c => numOf(c.localId) === num.n)) { try { byNum = await tdSearchNumber(num.n); } catch { } }
  const all = new Map();
  for (const c of [...byName, ...byNum]) all.set(c.id, c);
  const scored = [...all.values()].map(c => {
    const set = sets.get(setIdOf(c.id));
    const sameNum = !!num && numOf(c.localId) === num.n;
    const sameTotal = !!num && !!set && (set.cardCount?.official === num.total || set.cardCount?.total === num.total);
    let s = nameScore(c.name, nameTxt, cands) * 4;
    if (sameNum) s += 5;
    if (sameTotal) s += sameNum ? 4 : 0.5;
    if (c.image) s += 0.3;
    s += (set?.order ?? 0) / 10000; // tie-break toward newer sets
    return { c, set, s };
  });
  scored.sort((a, b) => b.s - a.s);
  return scored.slice(0, 10);
}

async function processCapture(canvas) {
  if (busy) return;
  busy = true;
  $('#scanTab').classList.remove('shutter');
  // freeze the frame and show a scan beam
  const fr = $('#frame');
  const still = document.createElement('canvas');
  still.width = canvas.width; still.height = canvas.height; still.getContext('2d').drawImage(canvas, 0, 0);
  fr.appendChild(still);
  const beam = document.createElement('div'); beam.className = 'beam'; fr.appendChild(beam);
  $('#camHint').textContent = 'Reading your card…';
  $('#camActions').hidden = true;
  if (navigator.vibrate) navigator.vibrate(30);
  const cleanup = () => { still.remove(); beam.remove(); $('#camHint').textContent = 'Fit the card inside the box'; $('#camActions').hidden = false; $('#camMsg').hidden = true; busy = false; if (currentTab === 'scan') $('#scanTab').classList.add('shutter'); };
  try {
    if (!ocrWorker) { camMessage('loading'); await getOCR(); $('#camMsg').hidden = true; }
    // bottom strip → card number like 025/165; top strip → name
    let numTxt = await ocr(region(canvas, 0, 0.875, 1, 0.115, 1600), '11', '0123456789/');
    let num = parseNum(numTxt);
    if (!num) { numTxt = await ocr(region(canvas, 0, 0.84, 1, 0.16, 1600), '6', '0123456789/'); num = parseNum(numTxt); }
    let nameTxt = await ocr(region(canvas, 0.02, 0.015, 0.8, 0.11, 1400), '11');
    if (!nameCandidates(nameTxt).length) nameTxt += '\n' + await ocr(region(canvas, 0.02, 0.015, 0.8, 0.11, 1400, true), '11');
    if (!nameCandidates(nameTxt).length && !num) throw new Error('unreadable');
    const matches = await identify(nameTxt, num);
    cleanup();
    if (!matches.length) throw new Error('nomatch');
    showMatches(matches, num);
  } catch (e) {
    cleanup();
    const offline = !navigator.onLine;
    openSheet(offline ? "You're offline" : "Hmm, couldn't read that one",
      `<div class="empty" style="padding:6px 0 0">
        <div style="font-size:52px">${offline ? '📶' : '🤔'}</div>
        <p style="margin-top:8px">${offline ? 'Connect to the internet to look up cards.' : 'Try these tips:'}</p>
      </div>
      ${offline ? '' : `<ul style="font-weight:700;line-height:1.7;color:var(--muted);margin:0 0 6px;padding-left:22px">
        <li>Fill the box with the card</li><li>Hold still and avoid glare</li><li>Turn on the light if it's dark</li><li>Take the card out of a shiny sleeve</li></ul>`}`,
      `<button class="btn primary block" id="tryAgain">Try again</button><button class="btn block" id="toSearch">Search by name</button>`);
    $('#tryAgain').onclick = () => closeTop();
    $('#toSearch').onclick = () => closeSheetThen(() => setTab('search'));
  }
}

function showMatches(matches, num) {
  const strong = matches[0] && matches[0].s > 9;
  openSheet('Which card is it?',
    `<p class="muted" style="margin:0 2px 14px;font-weight:700">${strong ? 'We think it’s the first one. Tap your card!' : 'Tap the one that matches your card.'}</p>
     ${resultGrid(matches.slice(0, strong ? 6 : 10), strong)}`,
    `<button class="btn block" id="retake">📷 Scan again</button><button class="btn block ghost" id="notHere">Not here? Search by name</button>`);
  $('#sheetBody').onclick = e => {
    const t = e.target.closest('[data-pick]'); if (!t) return;
    closeSheetThen(() => openDetail(t.dataset.pick));
  };
  $('#retake').onclick = () => closeTop();
  $('#notHere').onclick = () => closeSheetThen(() => setTab('search'));
}

function snap() {
  if (busy) return;
  if (!stream) { startCam(); return; }
  const c = grabFrame();
  if (!c) { toast('Camera is still starting…'); return; }
  processCapture(c);
}

    if (keyChanged) Object.keys(localStorage).filter(k => k.startsWith('hs.c.ppt:')).forEach(k => localStorage.removeItem(k));
    gh.sha = null;
    if (ghOn()) { await syncNow(); toast(syncState === 'ok' ? 'Saved & synced! ☁️' : 'Saved — ' + syncLabel(), syncState === 'error'); }
    else { setSync('off'); toast('Saved'); }
    if (detailId) { const c = mem.get(detailId); if (c) loadPpt(c); }
  };
  $('#exportBtn').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(coll, null, 2)], { type: 'application/json' }));
    a.download = `holoscope-backup-${today()}.json`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  $('#importBtn').onclick = () => $('#importInput').click();
  $('#importInput').onchange = async e => {
    const f = e.target.files?.[0]; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (!Array.isArray(data.cards)) throw 0;
      coll = data; saveColl(); toast(`Loaded ${data.cards.length} cards`);
    } catch { toast("That file isn't a HoloScope backup", true); }
  };
}
$('#settingsBtn').onclick = openSettings;

/* =========================================================
   Tabs + startup
   ========================================================= */
let currentTab = null;
function setTab(name) {
  if (layers.length) { closeAllThen(() => setTab(name)); return; }
  currentTab = name;
  $$('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + name));
  $$('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  $('#scanTab').classList.toggle('shutter', name === 'scan');
  $('#scanLabel').classList.toggle('active', name === 'scan');
  $('#scanLabel').textContent = name === 'scan' ? 'Snap!' : 'Scan';
  if (name === 'scan') startCam(); else stopCam();
  if (name === 'search') setTimeout(() => { $('#searchInput').focus(); if (!$('#searchInput').value) $('#searchResults').innerHTML = searchHint(); }, 60);
  if (name === 'collection') { renderCollection(); refreshPrices(); }
  ui.tab = name; store.set('hs.ui', ui);
}
$$('.tab').forEach(t => t.onclick = () => setTab(t.dataset.tab));
$('#scanTab').onclick = () => { if (currentTab === 'scan') snap(); else setTab('scan'); };
document.addEventListener('visibilitychange', () => {
  if (document.hidden) stopCam();
  else if (currentTab === 'scan' && !layers.length) startCam();
});

setTab(ui.tab === 'search' ? 'search' : 'collection');
syncNow();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
